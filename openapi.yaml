openapi: 3.0.3
info:
  title: Cosignal
  version: 0.1.0
  description: >-
    Care-team disposition layer for clinical AI. Producers submit drafts — notes,
    order proposals, dose findings, triage dispositions, inbox replies — which never
    reach the patient record until a named clinician with the licence and
    credentialed scope accepts, edits, rejects, or escalates them. Edits, overrides,
    interruption load, and returned minutes are captured from the same disposition
    stream and reconciled to scheduling and payroll.
  x-product-slug: ai-health-cosignal
  x-source: ai-in-health/Accenture-Health-Artificial-Intelligence/
servers:
  - url: https://api.example.com
tags:
  - name: Care Team
    description: Members, licences, credentialed scopes, supervision, and work sessions
  - name: Draft Queue
    description: Draft intake, evidence traces, routing, and deferral
  - name: Dispositions
    description: Accept, edit, reject, escalate, with edit deltas and unsafe flags
  - name: Co-signature Policy
    description: Per draft type rules, thresholds, and interruption budgets
  - name: Medication and Order Safety
    description: Dose findings and order proposals requiring prescriber signature
  - name: Documentation Attestation
    description: Review evidence, provenance, and billing-level support
  - name: Workload Ledger
    description: Minutes returned by role, reconciled and netted across roles
  - name: Safety Surveillance
    description: Unsafe rejections, harm linkage, and device surveillance records
paths:
  /v1/care-team/members:
    get:
      operationId: listCareTeamMembers
      tags: [Care Team]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/CareRole"
        - name: unitId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Care team members page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCareTeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/care-team/members/{memberId}/scope:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getScopeCredential
      tags: [Care Team]
      description: >-
        Licence, jurisdiction, credentialed scope, and supervision relationships
        resolved live rather than cached from onboarding.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Scope credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScopeCredential"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/care-team/work-sessions:
    post:
      operationId: openWorkSession
      tags: [Care Team]
      description: >-
        Starts a shift or clinic session, establishing the interruption budget and
        the scheduled minutes against which returned time is later reconciled.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionCreate"
      responses:
        "201":
          description: Work session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorkSession"
  /v1/producers:
    get:
      operationId: listProducerRegistrations
      tags: [Draft Queue]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Registered draft producers with model versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeProducerRegistration"
    post:
      operationId: registerProducer
      tags: [Draft Queue]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerRegistration"
      responses:
        "201":
          description: Producer registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProducerRegistration"
  /v1/drafts:
    get:
      operationId: listDraftArtifacts
      tags: [Draft Queue]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: assignedToMemberId
          in: query
          schema:
            type: string
        - name: draftType
          in: query
          schema:
            $ref: "#/components/schemas/DraftType"
        - name: state
          in: query
          schema:
            type: string
            enum: [queued, deferred, delivered, opened, dispositioned, suppressed, expired]
        - name: ageOverMinutes
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Draft queue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDraftArtifact"
    post:
      operationId: submitDraftArtifact
      tags: [Draft Queue]
      description: >-
        Producers submit here instead of writing to the record. The draft must carry
        its model version and an evidence trace for each clinical claim it asserts.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftArtifactCreate"
      responses:
        "201":
          description: Draft accepted into the queue and routed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDraftArtifact"
        "422":
          description: Evidence trace or model version missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "423":
          description: Draft type currently suppressed by override threshold breach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: getDraftArtifact
      tags: [Draft Queue]
      description: >-
        Marks the draft as opened, which is the review evidence later used for
        attestation and billing-level support.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Draft with evidence trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDraftArtifact"
        "403":
          description: Caller's role or scope may not dispose of this draft type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/drafts/{draftId}/reassignment:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: reassignDraftArtifact
      tags: [Draft Queue]
      description: >-
        Moves a draft to another permitted role, recording the transfer so that time
        credited to one role is netted against time added to another.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toMemberId, reason]
              properties:
                toMemberId:
                  type: string
                reason:
                  type: string
                  enum: [interruption_budget_exceeded, scope_mismatch, shift_ended, workload_balancing, escalation]
                note:
                  type: string
      responses:
        "200":
          description: Draft reassigned and transfer recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDraftArtifact"
  /v1/dispositions:
    get:
      operationId: listDispositionRecords
      tags: [Dispositions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: draftType
          in: query
          schema:
            $ref: "#/components/schemas/DraftType"
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/DispositionAction"
        - name: memberId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dispositions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDispositionRecord"
    post:
      operationId: recordDisposition
      tags: [Dispositions]
      description: >-
        The only path from a draft into the patient record. Records the action, the
        named clinician, the scope that permitted it, and the edit delta.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispositionRecordCreate"
      responses:
        "201":
          description: Disposition recorded and artefact released to the record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDispositionRecord"
        "403":
          description: Role, licence, or supervision status does not permit this disposition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Draft already dispositioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/dispositions/{dispositionId}/edit-delta:
    parameters:
      - $ref: "#/components/parameters/DispositionId"
    get:
      operationId: getEditDelta
      tags: [Dispositions]
      description: >-
        What changed between draft and final artefact, at the level of the specific
        claim or instruction altered.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Edit delta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEditDelta"
  /v1/drafts/{draftId}/unsafe-rejections:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: rejectDraftAsUnsafe
      tags: [Dispositions]
      description: >-
        Single-step rejection with a reason. Patterns open a review with a named
        owner and feed both model change control and the safety event system.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectedBy, reason]
              properties:
                rejectedBy:
                  type: string
                reason:
                  type: string
                  enum:
                    - factually_wrong_about_patient
                    - clinically_unsafe_recommendation
                    - wrong_patient
                    - missing_critical_context
                    - outside_my_scope
                    - sensitive_content_should_not_be_here
                    - fabricated_content
                narrative:
                  type: string
      responses:
        "201":
          description: Unsafe rejection recorded and review opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSafetySurveillanceRecord"
  /v1/dispositions/{dispositionId}/escalations:
    parameters:
      - $ref: "#/components/parameters/DispositionId"
    post:
      operationId: escalateDisposition
      tags: [Dispositions]
      description: >-
        Escalation always lands on a named owner with a clock; an unclaimed handoff
        is detected rather than lost.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationHandoffCreate"
      responses:
        "201":
          description: Escalation assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscalationHandoff"
  /v1/co-signature-rules:
    get:
      operationId: listCoSignatureRules
      tags: [Co-signature Policy]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Co-signature rules per draft type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCoSignatureRule"
    put:
      operationId: setCoSignatureRule
      tags: [Co-signature Policy]
      description: >-
        Governance-owned. States which roles may dispose of a draft type, what
        supervision applies, and what may never be auto-released.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoSignatureRule"
      responses:
        "200":
          description: Rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCoSignatureRule"
        "403":
          description: Only clinical governance may relax a co-signature rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/co-signature-rules/{draftType}/override-threshold:
    parameters:
      - name: draftType
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DraftType"
    put:
      operationId: setOverrideThreshold
      tags: [Co-signature Policy]
      description: >-
        Override and rejection rate above which the draft type is automatically
        suppressed pending review.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideThreshold"
      responses:
        "200":
          description: Threshold set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOverrideThreshold"
  /v1/interruption-budgets:
    put:
      operationId: setInterruptionBudget
      tags: [Co-signature Policy]
      description: >-
        Maximum drafts delivered per clinician-hour by role and setting. Drafts over
        budget are deferred, batched, or reassigned rather than delivered.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterruptionBudget"
      responses:
        "200":
          description: Budget set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInterruptionBudget"
  /v1/medication-safety/dose-findings:
    get:
      operationId: listDoseCheckFindings
      tags: [Medication and Order Safety]
      description: >-
        Findings routed into pharmacist scope with the renal function, weight, and
        current regimen needed to act rather than investigate.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: severity
          in: query
          schema:
            type: string
            enum: [informational, moderate, severe, contraindicated]
      responses:
        "200":
          description: Dose findings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDoseCheckFinding"
    post:
      operationId: submitDoseCheckFinding
      tags: [Medication and Order Safety]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoseCheckFinding"
      responses:
        "201":
          description: Finding queued to a pharmacist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDoseCheckFinding"
  /v1/medication-safety/order-proposals/{proposalId}/signature:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: signOrderProposal
      tags: [Medication and Order Safety]
      description: >-
        An order proposal becomes an order only here. Release without an authorised
        prescriber signature is blocked and recorded as an exception.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prescriberId, attestation]
              properties:
                prescriberId:
                  type: string
                attestation:
                  type: string
                  enum: [reviewed_and_ordered, reviewed_and_modified, reviewed_and_declined]
                modifications:
                  type: string
                supervisingPrescriberId:
                  type: string
      responses:
        "200":
          description: Order signed and released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOrderProposal"
        "403":
          description: Caller is not an authorised prescriber for this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/documentation/attestations:
    post:
      operationId: recordDocumentationAttestation
      tags: [Documentation Attestation]
      description: >-
        Records whether the signing clinician actually opened and reviewed the draft,
        and which portion was machine-drafted versus clinician-authored.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentationAttestationCreate"
      responses:
        "201":
          description: Attestation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDocumentationAttestation"
        "422":
          description: Draft was never opened, attestation cannot support a billing level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/documentation/attestations/{attestationId}:
    parameters:
      - name: attestationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDocumentationAttestation
      tags: [Documentation Attestation]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Attestation with review evidence and provenance split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDocumentationAttestation"
  /v1/workload/time-returned:
    get:
      operationId: listTimeReturnedLedger
      tags: [Workload Ledger]
      description: >-
        Minutes returned by role, reconciled to scheduling and payroll, with role
        transfers netted and conversion into direct care or after-hours reduction
        stated.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: period
          in: query
          schema:
            type: string
            example: 2026-W36
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/CareRole"
        - name: unitId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Time returned ledger page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTimeReturnedLedgerEntry"
  /v1/workload/time-returned/reconciliation:
    post:
      operationId: reconcileTimeReturned
      tags: [Workload Ledger]
      description: >-
        Submits scheduling and payroll actuals so that a returned-minutes claim is
        reconciled before it is reported.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, role, scheduledMinutes]
              properties:
                period:
                  type: string
                role:
                  $ref: "#/components/schemas/CareRole"
                unitId:
                  type: string
                scheduledMinutes:
                  type: integer
                paidMinutes:
                  type: integer
                afterHoursRecordMinutes:
                  type: integer
                sourceSystem:
                  type: string
      responses:
        "200":
          description: Reconciliation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTimeReturnedLedgerEntry"
  /v1/workload/queue-age-incidents:
    get:
      operationId: listQueueAgeIncidents
      tags: [Workload Ledger]
      description: >-
        Draft backlogs past their governance bound, raised as safety incidents rather
        than reported as productivity statistics.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Queue age incidents page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSafetySurveillanceRecord"
  /v1/surveillance/records:
    get:
      operationId: listSafetySurveillanceRecords
      tags: [Safety Surveillance]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: origin
          in: query
          schema:
            type: string
            enum: [unsafe_rejection, harm_event, override_threshold_breach, queue_age_breach, signature_bypass_attempt]
        - name: reportableOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Surveillance records page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSafetySurveillanceRecord"
  /v1/surveillance/records/{recordId}/harm-linkage:
    parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: linkHarmEvent
      tags: [Safety Surveillance]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [safetyEventRef, harmLevel]
              properties:
                safetyEventRef:
                  type: string
                harmLevel:
                  type: string
                  enum: [no_harm, near_miss, temporary_harm, permanent_harm, death]
                linkStrength:
                  type: string
                  enum: [suspected, plausible, probable, confirmed, ruled_out]
                narrative:
                  type: string
      responses:
        "201":
          description: Harm event linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSafetySurveillanceRecord"
  /v1/surveillance/device-packages:
    get:
      operationId: getDeviceSurveillancePackage
      tags: [Safety Surveillance]
      description: >-
        Assembles dispositions, unsafe rejections, and harm linkage into the
        post-market record a device classification requires, without a manual process.
      security:
        - BearerAuth: []
      parameters:
        - name: producerId
          in: query
          required: true
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Device surveillance package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSafetySurveillanceRecord"
  /v1/corpus/use-basis:
    put:
      operationId: setDispositionCorpusUseBasis
      tags: [Safety Surveillance]
      description: >-
        Gates use of draft-and-disposition pairs for model improvement. Withdrawing
        the basis withdraws the corpus, and clinicians are told their edits train it.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basis, clinicianNoticeGiven]
              properties:
                basis:
                  type: string
                  enum: [quality_improvement, research_protocol, vendor_agreement, withdrawn]
                agreementReference:
                  type: string
                boundaryConstraint:
                  type: string
                  enum: [buyer_tenant_only, vendor_environment_permitted, neutral_enclave]
                clinicianNoticeGiven:
                  type: boolean
                setBy:
                  type: string
      responses:
        "200":
          description: Corpus use basis recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProducerRegistration"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    DispositionId:
      name: dispositionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: USD
    CareRole:
      type: string
      enum: [attending_physician, resident, advanced_practice_provider, registered_nurse, licensed_practical_nurse, clinical_pharmacist, medical_assistant, care_coordinator]
    DraftType:
      type: string
      enum:
        - progress_note
        - discharge_summary
        - discharge_instructions
